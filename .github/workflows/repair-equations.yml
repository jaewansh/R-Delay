name: R-Delay native equation repair
on:
  push:
    branches: [codex/rdelay-bootstrap]
    paths: ['.github/workflows/repair-equations.yml']
permissions:
  contents: write
concurrency:
  group: rdelay-equation-repair
  cancel-in-progress: true
jobs:
  repair:
    if: ${{ github.ref == 'refs/heads/codex/rdelay-bootstrap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rdelay-bootstrap
          fetch-depth: 0
      - name: Install Writer AND Math plus document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math pandoc fonts-nanum fonts-dejavu-core fonts-texgyre fonts-crosextra-carlito poppler-utils
          python -m pip install 'python-docx==1.2.0' 'PyMuPDF==1.26.5' 'Pillow==11.3.0' 'lxml==6.0.2'
      - name: Compare Office Math layouts on actual PDF output
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.oxml.ns import qn
          import copy,subprocess,json,unicodedata
          import fitz
          work=Path('artifacts/equation_repair');work.mkdir(parents=True,exist_ok=True)
          formula=r'\frac{dI_i}{dt}=\beta_i(t)\left(1-\frac{I_i}{N_i}\right)\sum_j C_{ij}(t)I_j-\gamma_i(t)I_i'
          md=work/'native.md';md.write_text('$$\n'+formula+'\n$$\n')
          raw=work/'pandoc.docx'
          subprocess.run(['pandoc',str(md),'-o',str(raw)],check=True)
          source=Document(raw)
          mathpara=source._element.xpath('.//m:oMathPara')[0]
          sourcep=mathpara.getparent()
          results=[]
          for mode in ['nested','inline','paragraph','pandoc']:
              dest=work/(mode+'.docx')
              if mode=='pandoc':dest.write_bytes(raw.read_bytes())
              else:
                  d=Document()
                  if mode=='paragraph':d._element.body.insert(0,copy.deepcopy(sourcep))
                  else:
                      p=d.add_paragraph()
                      p._p.append(copy.deepcopy(mathpara if mode=='nested' else mathpara.find(qn('m:oMath'))))
                  d.save(dest)
              subprocess.run(['libreoffice','-env:UserInstallation=file:///tmp/rdelay-math-'+mode,'--headless','--convert-to','pdf','--outdir',str(work),str(dest)],check=True,capture_output=True)
              pdf=fitz.open(work/(mode+'.pdf'));page=pdf[0]
              text=unicodedata.normalize('NFKC',page.get_text())
              pix=page.get_pixmap(colorspace=fitz.csGRAY)
              ink=sum(v<160 for v in pix.samples)
              good=ink>100 and (len(text.strip())>15 or len(page.get_drawings())>20)
              results.append({'mode':mode,'text':text,'ink_pixels':ink,'drawings':len(page.get_drawings()),'render_present':good})
          print(json.dumps(results,ensure_ascii=False,indent=2))
          (work/'probe_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          preferred=next((x['mode'] for x in results if x['mode']=='inline' and x['render_present']),None)
          if preferred is None:raise RuntimeError('No verified inline Office Math export; do not deliver blank formulas')
          script=Path('scripts/build_documents.py');text=script.read_text()
          old='p._p.append(copy.deepcopy(EQCACHE[key]))'
          new='p._p.append(copy.deepcopy(EQCACHE[key].find(qn("m:oMath"))))'
          if old in text:
              assert text.count(old)==1
              text=text.replace(old,new)
          elif new not in text:raise RuntimeError('Equation code changed; refuse broad replacement')
          # Normalize whitespace for section placement: PDF Korean text can contain separated spaces.
          oldmap="checks['application_section_pages']={m:[i+1 for i,p in enumerate(f) if m in p.get_text()] for m in markers}"
          newmap="checks['application_section_pages']={m:[i+1 for i,p in enumerate(f) if re.sub(r'\\s+', '', m) in re.sub(r'\\s+', '', p.get_text())] for m in markers}"
          text=text.replace(oldmap,newmap)
          script.write_text(text)
          workflow=Path('.github/workflows/documents.yml');wf=workflow.read_text()
          if 'libreoffice-math' not in wf:wf=wf.replace('libreoffice-writer','libreoffice-writer libreoffice-math')
          workflow.write_text(wf)
          (work/'selected_method.txt').write_text('inline native OMML; LibreOffice Writer + Math installed')
          PY
      - name: Generate and inspect actual documents
        run: |
          python scripts/build_documents.py
          python - <<'PY'
          import fitz,json,unicodedata,re
          from pathlib import Path
          check=json.loads(Path('artifacts/document_check.json').read_text())
          pdf=fitz.open('deliverables/RDelay_참가신청서_v0.1.pdf');p=pdf[2]
          text=unicodedata.normalize('NFKC',p.get_text());flat=re.sub(r'\s+','',text)
          greek=sum(text.count(x) for x in ['β','γ','κ','ρ'])
          present=greek>=7 and ('dI' in flat or len(p.get_drawings())>30)
          audit={'application_equation_page':3,'greek_character_count':greek,'formula_text_present':present,'page3_text':text,'application_pages':check['application']['pages'],'design_pages':check['design']['pages'],'visual_review':'not yet performed; independent formula raster/text checks executed'}
          Path('artifacts/equation_repair/final_check.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          assert check['automatic_pass'],'Layout checks failed after visible equations were restored'
          assert present,'Native equations did not render in final application'
          assert all(v for v in check['application_section_pages'].values()),'A required section did not map to a page'
          PY
      - name: Commit repairs and regenerated outputs only on work branch
        run: |
          test "$(git branch --show-current)" = codex/rdelay-bootstrap
          git config user.name 'R-Delay document builder'
          git config user.email 'rdelay-builder@users.noreply.github.com'
          git add scripts/build_documents.py .github/workflows/documents.yml deliverables artifacts docs/implementation_status.md
          git commit -m 'fix: restore visible native equations with Writer+Math; regenerate checked DOCX/PDF [skip ci]'
          git push origin HEAD:codex/rdelay-bootstrap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RDelay-equation-repair-review
          path: |
            artifacts/equation_repair/
            artifacts/document_check.md
            deliverables/RDelay_참가신청서_v0.1.docx
            deliverables/RDelay_종합설계서_v0.1.pdf
          retention-days: 14
